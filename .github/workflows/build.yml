              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M34,38h40a6,6 0 0 1 6,6v18a6,6 0 0 1 -6,6H58l-8,8v-8H34a6,6 0 0 1 -6,-6V44a6,6 0 0 1 6,-6z" />
              <path android:fillColor="#6C4DFF" android:pathData="M36,47h32v4H36z" />
